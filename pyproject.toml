[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vikalp"
version = "0.1.0"
description = "Open-source options lab for Indian markets (NSE/BSE) with an MCP server for AI agents — free Sensibull/Opstra alternative"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vikalp contributors" }]
keywords = ["options", "nse", "bse", "india", "mcp", "greeks", "sensibull", "opstra", "trading"]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
kite = ["kiteconnect>=5.0.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vikalp-mcp = "vikalp.server:main"

[project.urls]
Homepage = "https://github.com/biranjan01/vikalp"
Issues = "https://github.com/biranjan01/vikalp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vikalp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
